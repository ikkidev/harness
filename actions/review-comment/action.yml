name: harness review comment
description: Turn the cloud reviewer's verdict comment into the harness/review status (and needs-human after round 3).
inputs:
  token:
    description: Token with statuses:write, pull-requests:write (to strip the footer from PR comments) and issues:write.
    default: ${{ github.token }}
  reviewer-login:
    description: The only GitHub login whose verdict comments count.
    required: true
  app-id:
    description: GitHub App id used to enable auto-merge on approval (optional).
    default: ''
  app-key:
    description: That App's private key, from a secret (optional).
    default: ''
  merge-method:
    description: merge, squash or rebase, for auto-merge.
    default: merge
  auto-merge-bases:
    description: Base branches (comma or space separated) whose PRs get auto-merge on approval. Only protected branches with required checks; never a release branch fed by promotes. Empty disables auto-merge.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - run: npm ci --omit=dev
      shell: bash
      working-directory: ${{ github.action_path }}/../..
    - run: node "${{ github.action_path }}/../../bin/review-comment-status.mjs"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HARNESS_REVIEWER_LOGIN: ${{ inputs.reviewer-login }}
        HARNESS_APP_ID: ${{ inputs.app-id }}
        HARNESS_APP_KEY: ${{ inputs.app-key }}
        HARNESS_MERGE_METHOD: ${{ inputs.merge-method }}
        HARNESS_AUTO_MERGE_BASES: ${{ inputs.auto-merge-bases }}

name: harness tier
description: Resolve the risk tier of a pull request, post the harness/tier status and set the risk label.
inputs:
  token:
    description: Token with statuses:write, pull-requests:write and contents:read.
    default: ${{ github.token }}
  config-path:
    description: Path of the harness config in the consumer repo.
    default: harness.yml
outputs:
  tier:
    description: Resolved tier (low, normal or high).
    value: ${{ steps.tier.outputs.tier }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - run: npm ci --omit=dev
      shell: bash
      working-directory: ${{ github.action_path }}/../..
    - id: tier
      run: node "${{ github.action_path }}/../../bin/tier-status.mjs"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HARNESS_CONFIG_PATH: ${{ inputs.config-path }}

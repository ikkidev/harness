name: harness evidence
description: Check the pull request body for issue link, tests and evidence and post the harness/evidence status.
inputs:
  token:
    description: Token with statuses:write, pull-requests:read and contents:read.
    default: ${{ github.token }}
  tier:
    description: Tier from the tier action (needs.tier.outputs.tier).
    required: true
  config-path:
    description: Path of the harness config in the consumer repo.
    default: harness.yml
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - run: npm ci --omit=dev
      shell: bash
      working-directory: ${{ github.action_path }}/../..
    - run: node "${{ github.action_path }}/../../bin/evidence-status.mjs"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HARNESS_TIER: ${{ inputs.tier }}
        HARNESS_CONFIG_PATH: ${{ inputs.config-path }}
